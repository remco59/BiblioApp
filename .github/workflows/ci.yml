name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biblio
          POSTGRES_PASSWORD: biblio
          POSTGRES_DB: biblio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U biblio" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://biblio:biblio@localhost:5432/biblio?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI-client is up-to-date
        run: |
          pnpm openapi
          git diff --exit-code apps/api/openapi.json packages/api-client/src/schema.ts

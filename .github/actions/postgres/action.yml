name: Postgres 16
description: >-
  Start Postgres 16 (biblio/biblio/biblio op poort 5432). Logt alleen in bij Docker Hub als er
  inloggegevens zijn, zodat de workflow ook zonder secrets (anoniem) werkt, en probeert de pull opnieuw.
inputs:
  username:
    description: Docker Hub-gebruikersnaam (optioneel)
    required: false
    default: ''
  password:
    description: Docker Hub-token (optioneel)
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Docker Hub-login (alleen met secrets)
      if: inputs.username != '' && inputs.password != ''
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Postgres starten
      shell: bash
      run: |
        for i in 1 2 3 4; do
          docker pull postgres:16 && break
          [ "$i" = 4 ] && { echo '::error::docker pull postgres:16 mislukt'; exit 1; }
          sleep $((i * 10))
        done
        docker run -d --name postgres -p 5432:5432 \
          -e POSTGRES_USER=biblio -e POSTGRES_PASSWORD=biblio -e POSTGRES_DB=biblio \
          postgres:16
        for i in $(seq 1 30); do
          docker exec postgres pg_isready -U biblio && exit 0
          sleep 2
        done
        echo '::error::Postgres werd niet gezond'
        docker logs postgres
        exit 1

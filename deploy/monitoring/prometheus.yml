global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: biblio-api
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token # bestand met alleen het token (zelfde als METRICS_TOKEN)
    static_configs:
      - targets: ['api:3000']

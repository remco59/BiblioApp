services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: biblio
      POSTGRES_PASSWORD: biblio
      POSTGRES_DB: biblio
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U biblio']
      interval: 5s
      retries: 10
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: biblio
      MINIO_ROOT_PASSWORD: biblio-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 biblio biblio-secret && mc mb --ignore-existing local/covers"
  mailpit:
    image: axllent/mailpit
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
